; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = socket://192.168.1.159:4444
upload_protocol = esptool
upload_port = socket://192.168.1.159:4444
upload_speed = 921600

; Настройки под твою плату
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.psram_type = qio
board_build.psram_size = 1MB
board_build.partitions = default.csv
board_build.flash_mode = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Только необходимые библиотеки для OLED
lib_deps = 
    adafruit/Adafruit AHTX0 @ ^2.0.0
    paulstoffregen/OneWire @ ^2.3.7
    milesburton/DallasTemperature @ ^3.11.0
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    olikraus/U8g2 @ ^2.35.19
    olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0
    bh1750 @ ^1.2.0      # ← добавляем эту
    igorantolic/Ai Esp32 Rotary Encoder @ ^1.5.0  # ← ЭТО БИБЛИОТЕКА ДЛЯ ЭНКОДЕРА

